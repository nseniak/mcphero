upstream backend {
    # Sticky routing: requests with the same mcp-session-id header
    # always hit the same backend.  Requests without the header
    # (dashboard, health checks) distribute round-robin.
    hash $http_mcp_session_id consistent;
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # ---------- Health check (bypasses sticky routing) ----------
    location /healthz {
        proxy_pass http://backend;
    }

    # ---------- API + MCP paths → backend ----------
    # ``/dev`` is the bundled demo MCP mount (gated by
    # ``MCPOLIS_DEMO_MOUNT`` in the backend); the prod-smoke harness
    # at scripts/prod-smoke.sh hits ``/dev/mcp-demo/mcp``.
    location ~ ^/(api|oauth|mcp|admin-mcp|\.well-known|health|dev)(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---------- Frontend SPA ----------
    location / {
        root /usr/share/nginx/html;
        # Fall back to `_app.html` (vanilla Vite shell) rather than
        # `/index.html` — the latter is the prerendered marketing home
        # page, which would paint for a frame before React mounts and
        # replaces it on every deep app route refresh.
        try_files $uri $uri/ /_app.html;
    }
}
