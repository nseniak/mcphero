# ---- redact_secrets: Layer 2 of the F-02 fix ----
#
# Catches what Layer 1 (the structlog processor) can't see: uvicorn
# access lines, third-party stdout that bypasses structlog, and
# Caddy headers. Top-level secret-shaped keys get masked to
# `[REDACTED]`; the explicit Caddy header deletes live in
# `reshape_caddy_access`.

[[tests]]
name = "redact_secrets: top-level password is masked"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "demo"
password = "hunter2"
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.password, "[REDACTED]", "password value masked")
  assert_eq!(.event, "demo", "non-secret fields untouched")
'''

[[tests]]
name = "redact_secrets: top-level Authorization is masked"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "demo"
Authorization = "Bearer xyz"
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.Authorization, "[REDACTED]", "Authorization header value masked")
  assert_eq!(.event, "demo")
'''

[[tests]]
name = "redact_secrets: api_key, token, client_secret, cookie all masked"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "demo"
api_key = "sk-abc"
token = "tok-xyz"
client_secret = "cs-123"
cookie = "session=abc"
user = "alice"
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.api_key, "[REDACTED]")
  assert_eq!(.token, "[REDACTED]")
  assert_eq!(.client_secret, "[REDACTED]")
  assert_eq!(.cookie, "[REDACTED]")
  assert_eq!(.user, "alice", "non-secret value untouched")
'''

[[tests]]
name = "redact_secrets: non-secret records pass through unchanged"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "app.startup"
level = "info"
org_id = "org-1"
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "app.startup")
  assert_eq!(.org_id, "org-1")
'''

# ---- reshape_caddy_access: Cookie/Authorization/Set-Cookie are deleted ----

[[tests]]
name = "reshape_caddy_access: request.headers.Cookie is deleted"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 200
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "GET"
uri = "/dashboard"
host = "mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.request.headers]
Cookie = ["session=abc123"]
Authorization = ["Bearer xyz"]
"Set-Cookie" = ["s=1; HttpOnly"]
"User-Agent" = ["curl/8"]

[[tests.outputs]]
extract_from = "reshape_caddy_access"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert!(!exists(.request.headers.Cookie), "Cookie header deleted")
  assert!(!exists(.request.headers.Authorization), "Authorization header deleted")
  assert!(!exists(.request.headers."Set-Cookie"), "Set-Cookie header deleted")
  assert_eq!(.user_agent, "curl/8", "User-Agent still lifted to top-level")
  assert_eq!(.event, "caddy.access.200")
'''
