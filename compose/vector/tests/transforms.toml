# Vector unit tests for the mcpolis log-forwarding pipeline.
#
# Run with:
#
#   vector test compose/vector/vector.toml compose/vector/tests/transforms.toml
#
# Vector treats multiple files as a single combined config, so the
# transforms defined in vector.toml are referenced here by name.

# ---- parse: structlog JSON → flat event with @timestamp ----

[[tests]]
name = "parse: structlog record renames timestamp to @timestamp"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
container_id = "abc123"
stream = "stdout"
message = '{"event":"app.startup","level":"info","timestamp":"2026-05-02T10:00:00Z","org_id":"org-1"}'

[[tests.outputs]]
extract_from = "parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "app.startup", "event passed through unchanged")
  assert_eq!(.level, "info", "level passed through unchanged")
  assert_eq!(.org_id, "org-1", "structured fields passed through unchanged")
  assert_eq!(."@timestamp", "2026-05-02T10:00:00Z", "timestamp renamed to @timestamp")
  assert!(!exists(.timestamp), "original timestamp field removed")
  assert_eq!(.service, "mcpolis-backend", "service tag added")
  assert_eq!(.container_name, "mcpolis-backend", "container_name preserved from docker_logs")
'''

# ---- parse: malformed inner JSON survives without crashing ----

[[tests]]
name = "parse: non-JSON message passes through with empty event"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
container_id = "abc123"
stream = "stdout"
message = "this is not JSON at all — early boot panic before configure_structlog"

[[tests.outputs]]
extract_from = "parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert!(!exists(.event), "no event for non-JSON line")
  assert_eq!(.service, "mcpolis-backend", "service tag still applied")
  assert_eq!(.container_name, "mcpolis-backend", "container_name still preserved")
'''

# ---- reshape_uvicorn_access: collapse high-cardinality access logs ----

[[tests]]
name = "reshape_uvicorn_access: 405 response gets bucketed"

[[tests.inputs]]
insert_at = "reshape_uvicorn_access"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
service = "mcpolis-backend"
logger = "uvicorn.access"
event = '172.20.0.6:36258 - "POST /api/ HTTP/1.1" 405'
level = "info"

[[tests.outputs]]
extract_from = "reshape_uvicorn_access"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "http.access.405", "event collapsed to status bucket")
  assert_eq!(.http_status, 405, "status extracted as int")
  assert_eq!(.http_method, "POST", "method extracted")
  assert_eq!(.http_path, "/api/", "path extracted")
  assert_eq!(.http_peer, "172.20.0.6:36258", "peer preserved as separate field")
  assert_eq!(.logger, "uvicorn.access", "logger field unchanged")
'''

[[tests]]
name = "parse: caddy container_name is tagged service=caddy"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
container_id = "def456"
stream = "stdout"
message = '{"level":"info","ts":1714900000.0,"logger":"http.log.access","msg":"handled request","status":200}'

[[tests.outputs]]
extract_from = "parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.service, "caddy", "caddy container is tagged as caddy service")
  assert_eq!(.logger, "http.log.access")
'''

# ---- reshape_caddy_access: collapse caddy access logs ----

[[tests]]
name = "reshape_caddy_access: 502 access record gets bucketed"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 502
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "POST"
uri = "/api/orgs"
host = "mcphero.io"
remote_ip = "203.0.113.42"

[[tests.outputs]]
extract_from = "reshape_caddy_access"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "caddy.access.502", "event collapsed to status bucket")
  assert_eq!(.http_status, 502, "status extracted as int")
  assert_eq!(.http_method, "POST", "method lifted to top-level")
  assert_eq!(.http_path, "/api/orgs", "path lifted to top-level")
  assert_eq!(.http_host, "mcphero.io", "host lifted to top-level")
  assert_eq!(.http_peer, "203.0.113.42", "remote_ip lifted as peer")
  assert_eq!(.message, "handled request", "msg moved to message")
  assert!(!exists(.msg), "msg field consumed")
'''

[[tests]]
name = "reshape_caddy_access: backend record passes through unchanged"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
service = "mcpolis-backend"
logger = "mcpolis.domain.services.org_runtime"
event = "org.runtime.initialized"
level = "info"

[[tests.outputs]]
extract_from = "reshape_caddy_access"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "org.runtime.initialized", "backend event preserved verbatim")
  assert!(!exists(.http_status))
'''

[[tests]]
name = "reshape_uvicorn_access: non-uvicorn record passes through unchanged"

[[tests.inputs]]
insert_at = "reshape_uvicorn_access"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
service = "mcpolis-backend"
logger = "mcpolis.domain.services.org_runtime"
event = "org.runtime.initialized"
level = "info"

[[tests.outputs]]
extract_from = "reshape_uvicorn_access"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "org.runtime.initialized", "event preserved verbatim")
  assert!(!exists(.http_status), "no http_* fields on non-uvicorn records")
  assert!(!exists(.http_method))
  assert!(!exists(.http_path))
'''

