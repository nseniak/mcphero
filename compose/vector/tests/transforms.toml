Authorization = "Bearer xyz"
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.Authorization, "[REDACTED]", "Authorization header value masked")
  assert_eq!(.event, "demo")
'''

[[tests]]
