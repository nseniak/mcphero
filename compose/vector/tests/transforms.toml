# Vector unit tests for the mcpolis log-forwarding pipeline.
#
# Run with:
#
#   vector test compose/vector/vector.toml compose/vector/tests/transforms.toml
#
# Vector treats multiple files as a single combined config, so the
# transforms defined in vector.toml are referenced here by name.

# ---- parse: structlog JSON → flat event with @timestamp ----

[[tests]]
name = "parse: structlog record renames timestamp to @timestamp"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "mcpolis-backend"
container_id = "abc123"
stream = "stdout"
message = '{"event":"app.startup","level":"info","timestamp":"2026-05-02T10:00:00Z","org_id":"org-1"}'

[[tests.outputs]]
extract_from = "parse"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "app.startup", "event passed through unchanged")
  assert_eq!(.level, "info", "level passed through unchanged")
  assert_eq!(.org_id, "org-1", "structured fields passed through unchanged")
  assert_eq!(."@timestamp", "2026-05-02T10:00:00Z", "timestamp renamed to @timestamp")
  assert!(!exists(.timestamp), "original timestamp field removed")
  assert_eq!(.service, "mcpolis-backend", "service tag added")
  assert_eq!(.container_name, "mcpolis-backend", "container_name preserved from docker_logs")
'''

# ---- parse: malformed inner JSON survives without crashing ----

[[tests]]
name = "parse: non-JSON message passes through with empty event"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
