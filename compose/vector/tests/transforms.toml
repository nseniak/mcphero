# ---- redact_secrets: credential headers in Caddy's header maps ----
#
# Caddy writes "REDACTED" for the values of Cookie, Set-Cookie,
# Authorization and Proxy-Authorization itself, but only while its
# `log_credentials` option is off. The pipeline removes these four
# headers on its own, from every header map Caddy writes: the request's
# (access, error and reverse-proxy records), the response's (access
# records) and the backend's response (the reverse proxy's debug
# record). The full Caddy lines below have the shapes Caddy 2.11.2
# writes with `log_credentials` on (captured, then host, addresses and
# values replaced).

[[tests]]
name = "redact_secrets: Cookie, Authorization and Set-Cookie request headers of a Caddy access record are removed"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 200
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "GET"
uri = "/dashboard"
host = "mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.request.headers]
Cookie = ["session=abc123"]
Authorization = ["Bearer xyz"]
"Set-Cookie" = ["s=1; HttpOnly"]
"User-Agent" = ["curl/8"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert!(!exists(.request.headers.Cookie), "Cookie header deleted")
  assert!(!exists(.request.headers.Authorization), "Authorization header deleted")
  assert!(!exists(.request.headers."Set-Cookie"), "Set-Cookie header deleted")
  assert_eq!(.request.headers."User-Agent", ["curl/8"], "other request headers kept")
  assert_eq!(.user_agent, "curl/8", "User-Agent still lifted to top-level")
  assert_eq!(.event, "caddy.access.200")
'''

[[tests]]
name = "redact_secrets: Caddy error record (not reshaped) has its credential request headers removed"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
container_id = "def456"
stream = "stdout"
message = '{"level":"error","ts":1791411787.0698211,"logger":"http.log.error","msg":"dial tcp 172.18.0.5:80: connect: connection refused","request":{"remote_ip":"203.0.113.42","remote_port":"61480","client_ip":"203.0.113.42","proto":"HTTP/1.1","method":"GET","host":"mcphero.io","uri":"/api/admin/users","headers":{"Accept":["*/*"],"Cookie":["mcpolis_session=RAWCOOKIESECRET1"],"Authorization":["Bearer RAWBEARERSECRET1"],"Proxy-Authorization":["Basic RAWPROXYSECRET1"],"User-Agent":["curl/8.7.1"]}},"duration":0.001224416,"status":502,"err_id":"iuwuxhjdk","err_trace":"reverseproxy.statusError (reverseproxy.go:1525)"}'

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.logger, "http.log.error", "error record is not reshaped")
  assert!(!exists(.request.headers.Cookie), "Cookie header removed")
  assert!(!exists(.request.headers.Authorization), "Authorization header removed")
  assert!(!exists(.request.headers."Proxy-Authorization"), "Proxy-Authorization header removed")
  assert_eq!(.request.headers.Accept, ["*/*"], "other request headers kept")
  assert_eq!(.request.headers."User-Agent", ["curl/8.7.1"], "other request headers kept")
  assert_eq!(.request.uri, "/api/admin/users", "rest of the request kept")
  assert_eq!(.status, 502)
  assert!(!contains(encode_json(.), "RAWCOOKIESECRET1"), "raw Cookie header reached the sink on an error record")
  assert!(!contains(encode_json(.), "RAWBEARERSECRET1"), "raw Authorization header reached the sink on an error record")
  assert!(!contains(encode_json(.), "RAWPROXYSECRET1"), "raw Proxy-Authorization header reached the sink on an error record")
'''

# The dashboard's sign-in callback answers with the session cookie.
[[tests]]
name = "redact_secrets: Set-Cookie response header of a Caddy access record is removed"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
container_id = "def456"
stream = "stdout"
message = '{"level":"info","ts":1791411787.0784714,"logger":"http.log.access","msg":"handled request","request":{"remote_ip":"203.0.113.42","remote_port":"61210","client_ip":"203.0.113.42","proto":"HTTP/1.1","method":"GET","host":"mcphero.io","uri":"/api/auth/callback?state=s1&code=GOOGLECODE123","headers":{"User-Agent":["Mozilla/5.0"],"Accept":["*/*"],"Cookie":["mcpolis_session=RAWCOOKIESECRET2"]}},"bytes_read":0,"user_id":"","duration":0.000635167,"size":0,"status":302,"resp_headers":{"Content-Length":["0"],"Via":["1.1 Caddy"],"Location":["/app"],"Server":["Caddy"],"Set-Cookie":["mcpolis_session=SESSIONSECRET123; HttpOnly; Secure"],"Date":["Wed, 07 Oct 2026 22:23:07 GMT"]}}'

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.event, "caddy.access.302", "access record reshaped")
  assert!(!exists(.resp_headers."Set-Cookie"), "Set-Cookie response header removed")
  assert!(!exists(.request.headers.Cookie), "Cookie request header removed")
  assert_eq!(.resp_headers.Location, ["/app"], "other response headers kept")
  assert_eq!(.resp_headers.Server, ["Caddy"], "other response headers kept")
  assert_eq!(.user_agent, "Mozilla/5.0", "User-Agent still lifted to top-level")
  assert_eq!(.http_path, "/api/auth/callback?state=s1&code=[REDACTED]", "Google code masked, state kept")
  assert!(!contains(encode_json(.), "SESSIONSECRET123"), "session cookie value still present in resp_headers")
  assert!(!contains(encode_json(.), "RAWCOOKIESECRET2"), "raw Cookie header reached the sink on an access record")
  assert!(!contains(encode_json(.), "GOOGLECODE123"), "Google code still in the record")
'''

# Caddy writes this record only at debug level. Its top-level `headers`
# map holds the backend's response headers: the session cookie and the
# redirect carrying the gateway code.
[[tests]]
name = "redact_secrets: Caddy reverse-proxy debug record has its credential headers removed and its Location masked"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
container_id = "def456"
stream = "stdout"
message = '{"level":"debug","ts":1791411787.0783987,"logger":"http.handlers.reverse_proxy","msg":"upstream roundtrip","upstream":"mcpolis-nginx-1:80","duration":0.000457166,"request":{"remote_ip":"203.0.113.42","remote_port":"61210","client_ip":"203.0.113.42","proto":"HTTP/1.1","method":"POST","host":"mcp.mcphero.io","uri":"/mcp/oauth/consent","headers":{"Authorization":["Bearer RAWBEARERSECRET3"],"X-Forwarded-For":["203.0.113.42"],"X-Forwarded-Proto":["https"],"X-Forwarded-Host":["mcp.mcphero.io"],"Via":["1.1 Caddy"],"User-Agent":["Mozilla/5.0"],"Accept":["*/*"],"Cookie":["mcpolis_session=RAWCOOKIESECRET3"]}},"headers":{"Content-Length":["0"],"Location":["https://claude.ai/api/mcp/auth_callback?code=GATEWAYCODE3&state=abc"],"Server":["nginx"],"Set-Cookie":["mcpolis_session=RESPCOOKIESECRET3; HttpOnly; Secure"],"Date":["Wed, 07 Oct 2026 22:23:07 GMT"]},"status":302}'

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.logger, "http.handlers.reverse_proxy", "debug record is not reshaped")
  assert!(!exists(.headers."Set-Cookie"), "Set-Cookie removed from the backend's response headers")
  assert_eq!(.headers.Location, ["https://claude.ai/api/mcp/auth_callback?code=[REDACTED]&state=abc"], "gateway code masked, rest of the redirect kept")
  assert_eq!(.headers.Server, ["nginx"], "other response headers kept")
  assert!(!exists(.request.headers.Cookie), "Cookie removed from the proxied request")
  assert!(!exists(.request.headers.Authorization), "Authorization removed from the proxied request")
  assert_eq!(.request.headers."X-Forwarded-For", ["203.0.113.42"], "other request headers kept")
  assert!(!contains(encode_json(.), "RESPCOOKIESECRET3"), "session cookie value reached the sink")
  assert!(!contains(encode_json(.), "RAWCOOKIESECRET3"), "raw Cookie header reached the sink")
  assert!(!contains(encode_json(.), "RAWBEARERSECRET3"), "raw Authorization header reached the sink")
  assert!(!contains(encode_json(.), "GATEWAYCODE3"), "gateway code reached the sink")
'''

