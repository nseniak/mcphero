# When this transform's program fails, Vector sends the ORIGINAL record,
# unmasked, to the sink. Header fields that are not maps must not make
# it fail.
[[tests]]
name = "redact_secrets: header fields that are not maps do not switch masking off"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "demo"
password = "hunter2"
request = "GET /mcp/oauth/consent?consent=STRINGTOKEN123"
resp_headers = ["Set-Cookie", "Location"]
headers = 12345
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.password, "[REDACTED]", "masking still applied")
  assert_eq!(.request, "GET /mcp/oauth/consent?consent=[REDACTED]", "a string request still has its URL masked")
  assert_eq!(.resp_headers, ["Set-Cookie", "Location"], "a list left as is")
  assert_eq!(.headers, 12345, "a number left as is")
'''

# ---- redact_secrets: secrets in the URLs of a Caddy record ----
#
# A Caddy record keeps the raw request target in `request.uri`, and its
# headers as arrays: `Referer` on the request, `Location` on a redirect.
# The consent token and OAuth codes must be masked in all of them before
# the sink, for access records (which pass through the Caddy reshape)
# and for error records (which don't).

[[tests]]
name = "redact_secrets: consent token in a Caddy request.uri is masked"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 200
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "GET"
uri = "/mcp/oauth/consent?consent=SECRETTOKEN123&state=abc"
host = "mcp.mcphero.io"
remote_ip = "203.0.113.42"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.http_path, "/mcp/oauth/consent?consent=[REDACTED]&state=abc", "http_path masked")
  assert_eq!(.request.uri, "/mcp/oauth/consent?consent=[REDACTED]&state=abc", "request.uri masked in place, rest of the target kept")
  assert!(!contains(encode_json(.), "SECRETTOKEN123"), "consent token still in the record")
'''

[[tests]]
name = "redact_secrets: Google callback code in a Caddy request.uri and the consent token in its Location are masked"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 302
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "GET"
uri = "/mcp/oauth/google/callback?state=xyz&code=4/SECRETCODE_GHI"
host = "mcp.mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.resp_headers]
Location = ["https://mcp.mcphero.io/mcp/oauth/consent?consent=PARKEDTOKEN123"]
Server = ["Caddy"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.request.uri, "/mcp/oauth/google/callback?state=xyz&code=[REDACTED]", "Google code masked, state kept")
  assert_eq!(.resp_headers.Location, ["https://mcp.mcphero.io/mcp/oauth/consent?consent=[REDACTED]"], "consent token masked in the redirect")
  assert!(!contains(encode_json(.), "SECRETCODE"), "authorization code still in the record")
  assert!(!contains(encode_json(.), "PARKEDTOKEN123"), "consent token still in the record")
'''

[[tests]]
name = "redact_secrets: gateway code in a Caddy Location response header is masked"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 302
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "POST"
uri = "/mcp/oauth/consent"
host = "mcp.mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.resp_headers]
Location = ["https://claude.ai/api/mcp/auth_callback?code=GATEWAYCODE123&state=abc"]
Server = ["Caddy"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.resp_headers.Location, ["https://claude.ai/api/mcp/auth_callback?code=[REDACTED]&state=abc"], "code masked, rest of the redirect kept")
  assert_eq!(.resp_headers.Server, ["Caddy"], "other response headers untouched")
  assert!(!contains(encode_json(.), "GATEWAYCODE123"), "gateway code still in the record")
'''

# The token match is unanchored on purpose: it also catches *_token params.
[[tests]]
name = "redact_secrets: refresh_token and id_token in a Caddy Location are masked"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
service = "caddy"
[tests.inputs.log_fields.resp_headers]
Location = ["https://client.example/cb?refresh_token=RT_SECRET_123&x=1", "https://client.example/cb?id_token=IDT_SECRET_123&x=1"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.resp_headers.Location, ["https://client.example/cb?refresh_token=[REDACTED]&x=1", "https://client.example/cb?id_token=[REDACTED]&x=1"], "both token values masked, rest of the URLs kept")
'''

[[tests]]
name = "redact_secrets: consent token in a Caddy Referer request header is masked"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 302
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "POST"
uri = "/mcp/oauth/consent"
host = "mcp.mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.request.headers]
Referer = ["https://mcp.mcphero.io/mcp/oauth/consent?consent=REFERERTOKEN123"]
"User-Agent" = ["Mozilla/5.0"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.request.headers.Referer, ["https://mcp.mcphero.io/mcp/oauth/consent?consent=[REDACTED]"], "consent token masked in Referer")
  assert_eq!(.request.headers."User-Agent", ["Mozilla/5.0"], "other request headers untouched")
  assert_eq!(.user_agent, "Mozilla/5.0", "User-Agent still lifted to top-level")
  assert!(!contains(encode_json(.), "REFERERTOKEN123"), "consent token still in the record")
'''

# A real Caddy 2.11 error line (a 502 while the backend is down). Caddy
# writes these even with access logging off, and they skip the reshape.
[[tests]]
name = "redact_secrets: Caddy error record (not reshaped) has its request.uri masked"

[[tests.inputs]]
insert_at = "parse"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
container_id = "def456"
stream = "stdout"
message = '{"level":"error","ts":1791384474.5757833,"logger":"http.log.error","msg":"dial tcp 172.18.0.5:80: connect: connection refused","request":{"remote_ip":"203.0.113.42","remote_port":"39690","client_ip":"203.0.113.42","proto":"HTTP/2.0","method":"GET","host":"mcp.mcphero.io","uri":"/mcp/oauth/consent?consent=ERRTOKEN123","headers":{"Cookie":["REDACTED"],"User-Agent":["Mozilla/5.0"],"Referer":["https://accounts.google.com/"]}},"duration":0.000306125,"status":502,"err_id":"qvn3rc4kf","err_trace":"reverseproxy.statusError (reverseproxy.go:1525)"}'

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.service, "caddy")
  assert_eq!(.logger, "http.log.error", "error record is not reshaped")
  assert!(!exists(.http_path), "no reshape output on an error record")
  assert_eq!(.request.uri, "/mcp/oauth/consent?consent=[REDACTED]", "consent token masked without the reshape")
  assert_eq!(.request.headers.Referer, ["https://accounts.google.com/"], "secret-free Referer untouched")
  assert!(!contains(encode_json(.), "ERRTOKEN123"), "consent token still in the record")
'''

[[tests]]
name = "redact_secrets: ordinary Caddy URLs are left unchanged"

[[tests.inputs]]
insert_at = "reshape_caddy_access"
type = "log"
[tests.inputs.log_fields]
container_name = "caddy"
service = "caddy"
logger = "http.log.access"
status = 302
msg = "handled request"
level = "info"
[tests.inputs.log_fields.request]
method = "GET"
uri = "/mcp/authorize?response_type=code&client_id=abc&code_challenge=XYZ&code_challenge_method=S256&state=s1"
host = "mcp.mcphero.io"
remote_ip = "203.0.113.42"
[tests.inputs.log_fields.request.headers]
Referer = ["https://claude.ai/"]
[tests.inputs.log_fields.resp_headers]
Location = ["https://accounts.google.com/o/oauth2/v2/auth?client_id=abc&response_type=code&state=s2"]

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.request.uri, "/mcp/authorize?response_type=code&client_id=abc&code_challenge=XYZ&code_challenge_method=S256&state=s1", "code_challenge and response_type=code untouched")
  assert_eq!(.http_path, .request.uri, "http_path untouched too")
  assert_eq!(.request.headers.Referer, ["https://claude.ai/"])
  assert_eq!(.resp_headers.Location, ["https://accounts.google.com/o/oauth2/v2/auth?client_id=abc&response_type=code&state=s2"])
'''

# When this transform's program fails, Vector sends the ORIGINAL record,
# unmasked, to the sink. A non-string `http_path` used to make it fail.
[[tests]]
name = "redact_secrets: a non-string http_path does not switch masking off"

[[tests.inputs]]
insert_at = "redact_secrets"
type = "log"
[tests.inputs.log_fields]
event = "demo"
password = "hunter2"
http_path = 12345
service = "mcpolis-backend"

[[tests.outputs]]
extract_from = "redact_secrets"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
  assert_eq!(.password, "[REDACTED]", "masking still applied")
  assert_eq!(.http_path, 12345, "non-string http_path left as is")
'''
