source = '''
  assert!(!exists(.event), "no event for non-JSON line")
  assert_eq!(.service, "mcpolis-backend", "service tag still applied")
  assert_eq!(.container_name, "mcpolis-backend", "container_name still preserved")
'''

# ---- reshape_uvicorn_access: collapse high-cardinality access logs ----

