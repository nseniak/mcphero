<!-- Source-of-truth SVG for the social-share / OG card.
     Rendered to frontend/public/og-image.png by scripts/generate-og-image.mjs.
     If you edit this, run `make og-image` from the repo root to regenerate the PNG. -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Off-white background with subtle brand accent bar -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563EB"/>

  <!-- Hero shield logo (yellow-bordered blue shield with white MCP glyph),
       fitted into a ~280-tall slot, vertically centered. -->
  <g transform="translate(133.5, 175) scale(0.583)">
    <path d="M200 20 L360 100 L340 300 L200 440 L60 300 L40 100 Z"
          fill="#2563EB" stroke="#FBBF24" stroke-width="22" stroke-linejoin="round"/>
    <g transform="translate(80, 95) scale(1.35)">
      <path d="M18 84.8528L85.8822 16.9706C95.2548 7.59798 110.451 7.59798 119.823 16.9706V16.9706C129.196 26.3431 129.196 41.5391 119.823 50.9117L68.5581 102.177"
            stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M69.2652 101.47L119.823 50.9117C129.196 41.5391 144.392 41.5391 153.765 50.9117L154.118 51.2652C163.491 60.6378 163.491 75.8338 154.118 85.2063L92.7248 146.6C89.6006 149.724 89.6006 154.789 92.7248 157.913L105.331 170.52"
            stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M102.853 33.9411L52.6482 84.1457C43.2756 93.5183 43.2756 108.714 52.6482 118.087V118.087C62.0208 127.459 77.2167 127.459 86.5893 118.087L136.794 67.8822"
            stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Wordmark + tagline block -->
  <text x="460" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#0F172A" letter-spacing="-2">MCP Hero</text>
  <text x="460" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#475569">Manage every MCP your team uses,</text>
  <text x="460" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#475569">from one place.</text>
</svg>
