<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

         are emitted per-page via the <Seo> component (react-helmet-async).
         Don't duplicate them here: Helmet doesn't replace static head tags
         it didn't insert, so anything here would coexist with Helmet's
         output as duplicates in the prerendered HTML. -->

    <script type="module" src="/src/main.tsx"></script>
